version: "3.8"

services:
  lp-eliane:
    image: ghcr.io/felip2ee/lp-beaba-9rs:latest
    networks:
      - RainhaNet
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=RainhaNet

        # HTTPS
        - traefik.http.routers.lp-eliane.rule=Host(`beaba.elianearainhadocredito.com`)
        - traefik.http.routers.lp-eliane.entrypoints=websecure
        - traefik.http.routers.lp-eliane.tls.certresolver=letsencryptresolver
        - traefik.http.routers.lp-eliane.priority=1
        - traefik.http.routers.lp-eliane.service=lp-eliane
        - traefik.http.services.lp-eliane.loadbalancer.server.port=80
        - traefik.http.services.lp-eliane.loadbalancer.passHostHeader=true

networks:
  RainhaNet:
    external: true
    name: RainhaNet
