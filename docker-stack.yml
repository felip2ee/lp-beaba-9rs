version: "3.8"

services:
  lp-eliane:
    image: ghcr.io/SEU-USUARIO/lp-eliane-credito:latest
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.constraint-label=traefik-public

        # HTTPS
        - traefik.http.routers.lp-eliane.rule=Host(`lp.seudominio.com.br`)
        - traefik.http.routers.lp-eliane.entrypoints=websecure
        - traefik.http.routers.lp-eliane.tls=true
        - traefik.http.routers.lp-eliane.tls.certresolver=letsencrypt
        - traefik.http.routers.lp-eliane.service=lp-eliane
        - traefik.http.services.lp-eliane.loadbalancer.server.port=80

        # HTTP -> HTTPS
        - traefik.http.routers.lp-eliane-http.rule=Host(`lp.seudominio.com.br`)
        - traefik.http.routers.lp-eliane-http.entrypoints=web
        - traefik.http.routers.lp-eliane-http.middlewares=lp-eliane-redirect
        - traefik.http.middlewares.lp-eliane-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.lp-eliane-redirect.redirectscheme.permanent=true

networks:
  traefik-public:
    external: true
